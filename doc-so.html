<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đọc số DataSnap</title>
<style>
  :root{--nen:#f1f5f9;--the:#fff;--vien:#e2e8f0;--chu:#0f172a;--mo:#64748b;--xanh:#0b5ed7;--luc:#0f9d58;--cam:#e08e0b;--do:#d93025}
  *{box-sizing:border-box}
  body{margin:0 auto;background:var(--nen);color:var(--chu);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:820px}
  h1{font-size:20px;margin:4px 0}
  h3{font-size:15px;margin:16px 0 6px}
  .phu{color:var(--mo);font-size:13px}
  .the{background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  textarea{width:100%;min-height:90px;border:1px solid var(--vien);border-radius:9px;padding:9px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
  .hang{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
  button{border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;color:#fff;background:var(--xanh);cursor:pointer}
  button.phu2{background:#64748b} button.mini{padding:5px 10px;font-size:12px}
  button.tab{background:#e2e8f0;color:var(--chu)} button.tab.on{background:var(--xanh);color:#fff}
  .canhbao{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
  .canhbao li{margin:2px 0}
  .ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
  .tenST{font-size:18px;font-weight:800;margin:0}
  .stTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .htBig{font-size:30px;font-weight:900;line-height:1;white-space:nowrap}
  .bar{height:9px;border-radius:5px;background:#e2e8f0;overflow:hidden;margin:8px 0 2px}
  .bar i{display:block;height:100%;border-radius:5px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:12px 0 4px}
  .tile{background:#f8fafc;border:1px solid var(--vien);border-radius:11px;padding:8px 10px}
  .tile .k{font-size:11px;color:var(--mo)} .tile .v{font-size:16px;font-weight:800}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:5px 4px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
  th{color:var(--mo);font-weight:600;font-size:11px;text-transform:uppercase}
  td.ten,th.ten{text-align:left;white-space:normal}
  td.chk,th.chk{width:34px;text-align:center}
  tr.mo td{opacity:.45}
  tr.con td{font-size:12px;color:var(--mo);background:#f8fafc}
  .cuon{overflow-x:auto}
  .cham{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .minibar{display:inline-block;width:56px;height:6px;border-radius:3px;background:#e2e8f0;vertical-align:middle;overflow:hidden;margin-left:4px}
  .minibar i{display:block;height:100%}
  td.ten{min-width:120px}
  @media (max-width:480px){ th,td{padding:5px 3px} }
  table.td td{vertical-align:top} table.td td.ten .phu{font-size:12px;margin-left:13px}
  table.td .minibar{display:block;margin:3px 0 0 auto}
  .pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
  .doiChieu{font-size:12px;color:var(--mo);margin-top:6px}
  .doiChieu.lech{color:var(--cam);font-weight:700}
  details summary{cursor:pointer;font-weight:700;color:var(--xanh);font-size:14px}
  .an{display:none}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--xanh)}
  .hop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
  .hop.an{display:none}
  .hop>div{background:#fff;border-radius:16px 16px 0 0;max-width:820px;width:100%;max-height:80vh;overflow:auto;padding:14px}
  .hop label{display:flex;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid #f1f5f9;font-size:14px}
  /* thẻ nhân viên */
  .nv{padding:9px 2px;border-bottom:1px solid #f1f5f9}
  .nv.mo{opacity:.5}
  .nvDau{display:flex;align-items:center;gap:8px}
  .nvHang{min-width:26px;font-weight:800;color:var(--mo);text-align:center}
  .nvTen{flex:1;min-width:0}
  .nvSo{font-weight:900;font-size:16px;white-space:nowrap}
  .bar.mong{height:6px;margin:5px 0 3px}
  .chips{margin-top:3px}
  .chips span{display:inline-block;background:#eef2ff;color:#334155;border-radius:7px;padding:1px 7px;margin:3px 4px 0 0;font-size:12px}
  /* ảnh chia sẻ — vẽ ngoài màn rồi html2canvas */
  #khungAnh{position:fixed;left:-10000px;top:0}
  .anh{width:600px;background:#fff;font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;color:var(--chu)}
  .anhDau{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,#0b5ed7,#0a3d91);color:#fff;padding:18px 20px}
  .anhTen{font-size:22px;font-weight:900}
  .anhPhu{font-size:12px;opacity:.85;margin-top:2px}
  .anhHT{font-size:34px;font-weight:900;text-align:right;line-height:1}
  .anhHT small{display:block;font-size:11px;font-weight:600;opacity:.85;margin-top:4px}
  .anhThan{padding:6px 20px 14px}
  .anh .minibar{display:inline-block}
  .anhChan{background:#f1f5f9;color:var(--mo);font-size:11px;padding:8px 20px;text-align:right}
</style>
</head>
<body>
<h1>📲 Đọc số DataSnap</h1>
<div class="phu">App DataSnap chụp bảng DMXWork → trang này phân loại &amp; tổng hợp. Số chỉ nằm trên máy này.</div>

<div class="the" id="khuNap">
  <div id="trangThai" class="phu">Chưa có gói số.</div>
  <details id="napTay"><summary>Nạp gói bằng tay</summary>
    <textarea id="oDan" placeholder="Dán gói dmxsnap/1 (JSON) vào đây…"></textarea>
    <div class="hang">
      <button onclick="napTuO()">Nạp gói đã dán</button>
      <label class="phu"><input type="file" id="oTep" accept=".json,application/json" style="width:auto"> hoặc chọn tệp .json</label>
      <button class="phu2" onclick="napMau()">Nạp mẫu (tên giả)</button>
    </div>
  </details>
</div>

<div id="khuXem" class="an">
  <div class="hang" id="chonKy"></div>
  <div class="hang" id="chonST"></div>
  <div id="canhBao"></div>
  <div id="ra"></div>
  <div class="hang">
    <button onclick="chiaSeAnh(XEM)">📤 Chia sẻ ảnh <span id="nhanChiaSe">cả cụm</span></button>
    <button class="phu2" onclick="chepBaoCao()">📋 Chép báo cáo chữ</button>
  </div>
  <div class="hang phu" id="khuBot"></div>
</div>
<div id="khungAnh"></div>

<div id="hop" class="hop an" onclick="if(event.target===this)dongHop()"><div id="hopND"></div></div>

<script src="assets/dmxsnap.js"></script>
<script>
/* ===================================================================
 * doc-so.html — xem số do app DataSnap chụp (gói dmxsnap/1).
 * Vào gói:  • app gọi window.nhanGoi(chuỗiJSON) (WebView evaluateJavascript)
 *           • dán / chọn tệp ở ô "Nạp gói bằng tay"
 * Lưu máy:  dmxsnap_goi_v1      {realtime:gói, luyke:gói}  (gói mới thay gói cũ cùng kỳ)
 *           dmxsnap_quantam_v1  {mãST:{tênChươngTrình:false}} — chương trình KHÔNG theo dõi
 *           dmxsnap_nvphu_v1    {mãST:{mãNV:1|'c'}}           — sửa tay: 1 không phải / 'c' là NV chính
 * =================================================================== */
var K_GOI='dmxsnap_goi_v1', K_QT='dmxsnap_quantam_v1', K_NV='dmxsnap_nvphu_v1';
function doc(k,mac){try{return JSON.parse(localStorage.getItem(k)||'null')||mac;}catch(e){return mac;}}
function ghi(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var GOI=doc(K_GOI,{}), QT=doc(K_QT,{}), NVPHU=doc(K_NV,{});
var KY=GOI.realtime?'realtime':(GOI.luyke?'luyke':'realtime'), XEM='tat', KQ=null, MO_NV={};

function f1(v){return v==null?'—':(Math.round(v*10)/10).toLocaleString('vi-VN');}
function f2(v){return v==null?'—':(Math.round(v*100)/100).toLocaleString('vi-VN');}
function pc(v){return v==null?'—':f1(v)+'%';}
function mau(ht){if(ht==null)return 'var(--mo)';if(ht>=100)return 'var(--luc)';if(ht>=80)return 'var(--cam)';return 'var(--do)';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var TEN_KY={realtime:'Realtime',luyke:'Lũy kế'};
// app 5.0 ghi "18:22:26 03/11/2026" (ngày/tháng) thay vì ISO — new Date() hiểu nhầm thành 11/3
function docLuc(s){ var m=/^(\d\d):(\d\d):(\d\d) (\d\d)\/(\d\d)\/(\d{4})$/.exec(s||''); return m?new Date(+m[6],m[5]-1,+m[4],+m[1],+m[2],+m[3]):new Date(s); }

/* ---------- nạp gói ---------- */
function nhanGoi(chuoi){
  var g; try{ g=typeof chuoi==='string'?JSON.parse(chuoi):chuoi; }catch(e){ return 'loi: JSON hỏng'; }
  if(!g||g.dinhDang!=='dmxsnap/1'||!Array.isArray(g.lan)) return 'loi: không phải gói dmxsnap/1';
  var ky=(g.lan[0]||{}).ky; if(ky!=='realtime'&&ky!=='luyke') return 'loi: gói không ghi kỳ';
  GOI[ky]=g; ghi(K_GOI,GOI); GC=gioCong();
  // App nạp lại CẢ hai gói sau mỗi lần quét → mở kỳ vừa quét (gói mới nhất), không phải gói nạp sau cùng.
  KY=['realtime','luyke'].filter(function(k){return GOI[k];}).sort(function(a,b){return docLuc(GOI[b].luc)-docLuc(GOI[a].luc);})[0]||ky;
  ve(); henGuiBot();
  return 'ok: '+TEN_KY[ky]+' · '+g.lan.length+' lượt';
}
window.nhanGoi=nhanGoi;
function napTuO(){ var r=nhanGoi(document.getElementById('oDan').value); thongBao(r); }
document.getElementById('oTep').onchange=function(){ var t=this.files[0]; if(!t)return; var fr=new FileReader(); fr.onload=function(){ thongBao(nhanGoi(fr.result)); }; fr.readAsText(t); };
function napMau(){ fetch('assets/dmxsnap-mau.json').then(function(r){return r.text();}).then(function(t){ thongBao(nhanGoi(t)); }).catch(function(){ thongBao('loi: không tải được gói mẫu'); }); }
function thongBao(r){ var el=document.getElementById('trangThai'); el.className=/^ok/.test(r)?'ok':'canhbao'; el.textContent=r.replace(/^(ok|loi): /,''); if(/^ok/.test(r))document.getElementById('napTay').open=false; }

/* ---------- vẽ ---------- */
function ve(){
  var co=Object.keys(GOI).filter(function(k){return GOI[k];});
  document.getElementById('khuXem').classList.toggle('an',!co.length);
  if(!co.length) return;
  if(!GOI[KY]) KY=co[0];
  KQ=DmxSnap.docGoi(GOI[KY]);
  var g=GOI[KY], luc=docLuc(g.luc);
  var tt=document.getElementById('trangThai');
  if(tt.className!=='ok'&&tt.className!=='canhbao'){ tt.className='phu'; }
  tt.innerHTML='Gói '+TEN_KY[KY]+' chụp lúc <b>'+luc.toLocaleString('vi-VN')+'</b>'+(g.nguon?' · '+esc(g.nguon):'')+
    (luc.toDateString()!==new Date().toDateString()?' · <b style="color:var(--do)">KHÔNG PHẢI HÔM NAY</b>':'');
  document.getElementById('chonKy').innerHTML=['realtime','luyke'].map(function(k){
    return '<button class="tab'+(k===KY?' on':'')+'"'+(GOI[k]?'':' disabled style="opacity:.4"')+' onclick="KY=\''+k+'\';ve()">'+TEN_KY[k]+'</button>';}).join('');
  document.getElementById('chonST').innerHTML=[['tat','Cả cụm']].concat(KQ.thuTu.map(function(m){return [m,KQ.sieuThi[m].ten];})).map(function(x){
    return '<button class="tab mini'+(x[0]===XEM?' on':'')+'" onclick="XEM=\''+x[0]+'\';ve()">'+esc(x[1])+'</button>';}).join('');
  document.getElementById('canhBao').innerHTML=KQ.canhBao.length?'<div class="canhbao"><b>⚠ Cần xem lại</b><ul style="margin:4px 0;padding-left:18px">'+KQ.canhBao.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul></div>':'';
  if(XEM!=='tat'&&!KQ.sieuThi[XEM]) XEM='tat';
  document.getElementById('nhanChiaSe').textContent=XEM==='tat'?'cả cụm':KQ.sieuThi[XEM].ten;
  var ds=KQ.thuTu.filter(function(m){return XEM==='tat'||XEM===m;});
  document.getElementById('ra').innerHTML=ds.map(veST).join('')||'<div class="the phu">Gói không có siêu thị nào đọc được.</div>';
}

/* NV chính: có giờ công (app 5.5) → đúng phòng ban "BP All In One" tại siêu thị này trong 7 ngày;
 * gói cũ chưa có giờ công → mọi người có mã NV. Tay chỉnh (NVPHU) đè lên: 1 = không phải, 'c' = là NV chính. */
function gioCong(){
  var g=['realtime','luyke'].map(function(k){return GOI[k];}).filter(function(g){return g&&g.gioCong;})
    .sort(function(a,b){return docLuc(b.luc)-docLuc(a.luc);})[0];
  return g?DmxSnap.docGioCong(g.gioCong):null;
}
var GC=gioCong();
function gcNV(s,n){ return GC&&GC.theoST[s.ma]?(GC.theoST[s.ma][n.ma]||null):undefined; }
function chinhTuDong(s,n){ var g=gcNV(s,n); return n.chinhThuc&&(g===undefined||!!(g&&g.aio)); }
function laChinh(s,n){ var o=(NVPHU[s.ma]||{})[n.ma]; return o==='c'?true:o?false:chinhTuDong(s,n); }
function lyDoKhac(s,n){
  var o=(NVPHU[s.ma]||{})[n.ma], g=gcNV(s,n);
  if(!n.chinhThuc) return 'không có mã NV';
  if(o) return 'anh/chị đã bỏ tích';
  return g?g.pb.replace(/ - ĐMX$/,''):g===null?'không có giờ công tại siêu thị này '+(GC.tu||'')+'–'+(GC.den||''):'';
}
function nvChinh(s){ return s.nv.filter(function(n){return laChinh(s,n);}); }
function nvKhac(s){ return s.nv.filter(function(n){return !laChinh(s,n);}); }
function thiDuaTheoDoi(s){ var an=QT[s.ma]||{}; return s.thiDua.filter(function(t){return an[t.ten]!==false;}); }
function cong(ds,k){ return ds.reduce(function(a,x){return a+(x[k]||0);},0); }

/* ---------- chọn & xếp (dùng chung cho màn xem, ảnh chia sẻ, văn bản) ----------
 * Thi đua  Realtime: chỉ chương trình ĐÃ BÁN (thực hiện > 0), % HT giảm dần.
 *          Lũy kế : mọi chương trình theo dõi, % HT target giảm dần; màu theo % dự báo cuối tháng.
 * Ngành BI: chỉ ngành có số, DTQĐ giảm dần. NV: NV chính, DTQĐ giảm dần, kèm ngành đã bán. */
var HUY=['🥇','🥈','🥉'];
function dgTD(x){ return KY==='luyke'&&x.duBao!=null?x.duBao:x.ht; }
function dsThiDua(s){
  var ds=thiDuaTheoDoi(s);
  if(KY==='realtime') ds=ds.filter(function(x){return x.th>0;});
  return ds.slice().sort(function(a,b){ return (b.ht==null?-1:b.ht)-(a.ht==null?-1:a.ht) || (b.th||0)-(a.th||0); });
}
function dsNganh(s){ return s.nganh.filter(function(x){return x.dtqd||x.sl;}).sort(function(a,b){return (b.dtqd||0)-(a.dtqd||0);}); }
function dsNV(s){ return nvChinh(s).slice().sort(function(a,b){return (b.dtqd||0)-(a.dtqd||0);}); }
function nganhNV(n){ return n.nganh.filter(function(g){return g.dtqd||g.sl;}).sort(function(a,b){return (b.dtqd||0)-(a.dtqd||0);}); }
function htST(t){ return t.ht!=null?t.ht:(t.target?t.dtqd/t.target*100:null); }

function veST(ma){
  var s=KQ.sieuThi[ma], t=s.tong, ht=htST(t), m=mau(KY==='luyke'&&t.duBao!=null?t.duBao:ht);
  var h='<div class="the" id="st-'+ma+'"><div class="stTop"><div><p class="tenST">'+esc(s.ten)+'</p>'+
    '<div class="phu">'+TEN_KY[KY]+' · DT quy đổi · cập nhật '+esc(s.capNhat||'—')+'</div>'+
    '<button class="mini" style="margin-top:6px" onclick="chiaSeAnh(\''+ma+'\')">📤 Chia sẻ ảnh</button></div>'+
    '<div style="text-align:right"><div class="htBig" style="color:'+m+'">'+pc(ht)+'</div><div class="phu">'+(KY==='realtime'?'HT target ngày':'HT target tháng')+'</div></div></div>'+
    '<div class="bar"><i style="width:'+Math.min(100,ht||0)+'%;background:'+m+'"></i></div>'+veTiles(t);
  h+=veThiDua(s)+veNV(s)+veNganh(s)+veMaTran(s);
  return h+'</div>';
}
function veTiles(t){
  var gop=(t.traGop!=null&&t.dtqd)?t.traGop/t.dtqd*100:null;
  return '<div class="tiles">'+
    tile('DTQĐ',f1(t.dtqd)+' tr')+tile(KY==='realtime'?'Target ngày':'Target tháng',f1(t.target)+' tr')+
    tile('Còn thiếu',t.target!=null&&t.dtqd!=null?f1(Math.max(0,t.target-t.dtqd))+' tr':'—')+tile('Số lượng',f1(t.sl))+
    tile('Trả góp',pc(gop))+(t.duBao!=null?tile('Dự báo tháng',pc(t.duBao)+(t.duKienTien!=null?'<div class="phu">'+f1(t.duKienTien)+' tr</div>':'')):'')+
    (t.tlpvtc!=null?tile('TLPVTC',pc(t.tlpvtc)):'')+
  '</div>'+(t.tlpvtcPhu?'<div class="phu">'+esc(t.tlpvtcPhu)+'</div>':'');
}
function tile(k,v){return '<div class="tile"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';}

function tomTatTD(s,ds){
  var tdoi=thiDuaTheoDoi(s), dat=0,can=0,chua=0;
  ds.forEach(function(x){ var v=dgTD(x); if(v>=100)dat++; else if(v>=80)can++; else chua++; });
  var chuaBan=tdoi.length-ds.length, boQT=s.thiDua.length-tdoi.length;
  return dat+' đạt · '+can+' cận đích · '+chua+' chưa đạt'+(KY==='luyke'?' (theo dự báo cuối tháng)':'')+
    (KY==='realtime'&&chuaBan?' · '+chuaBan+' chương trình chưa bán (ẩn)':'')+(boQT?' · bỏ theo dõi '+boQT:'');
}
// gọn cho màn điện thoại: tên + "thực hiện / target" chung 1 ô, cột % HT (và dự báo ở Lũy kế)
function bangThiDua(ds){
  var coHang=ds.some(function(x){return x.hang&&x.hang!=='—';});
  var h='<table class="td"><tr><th class="ten">Chương trình · thực hiện / '+(KY==='realtime'?'target ngày':'target')+'</th><th>% HT</th>'+
    (KY==='luyke'?'<th>Dự báo</th>':'')+'</tr>';
  ds.forEach(function(x,i){
    var dv=x.loai==='SL'?' cái':' tr', so=x.loai==='SL'?f1:f2;
    h+='<tr><td class="ten"><span class="cham" style="background:'+mau(dgTD(x))+'"></span><span class="phu">'+(i+1)+'.</span> '+esc(x.ten)+
        '<div class="phu">'+so(x.th)+' / '+so(x.target)+dv+(coHang&&x.hang&&x.hang!=='—'?' · hạng '+esc(x.hang):'')+'</div></td>'+
      '<td><b style="color:'+mau(x.ht)+'">'+pc(x.ht)+'</b><div class="minibar"><i style="width:'+Math.min(100,x.ht||0)+'%;background:'+mau(x.ht)+'"></i></div></td>'+
      (KY==='luyke'?'<td><b style="color:'+mau(x.duBao)+'">'+pc(x.duBao)+'</b></td>':'')+'</tr>';
  });
  return h+'</table>';
}
function veThiDua(s){
  if(!s.daDoc.thiDua) return '<h3>🏁 Thi đua</h3><div class="phu">Chưa đọc được bảng thi đua.</div>';
  var ds=dsThiDua(s);
  var h='<h3>🏁 Thi đua '+(KY==='realtime'?'đã bán hôm nay':'— % target giảm dần')+' <span class="pill">'+ds.length+'</span> '+
    '<button class="mini phu2" onclick="moChonQT(\''+s.ma+'\')">Chọn ngành</button></h3><div class="phu">'+tomTatTD(s,ds)+'</div>';
  return h+(ds.length?bangThiDua(ds):'<div class="phu">Chưa bán chương trình thi đua nào.</div>');
}

// cheDo: 'chinh' (có ô tick, xếp hạng) | 'khac' (mờ, không hạng) | 'anh' (ảnh chia sẻ)
function theNV(s,n,i,max,cheDo){
  var gop=(n.traGop!=null&&n.dtqd)?n.traGop/n.dtqd*100:null, ng=nganhNV(n);
  var tick=cheDo!=='anh'&&n.chinhThuc?'<input type="checkbox"'+(cheDo==='chinh'?' checked':'')+' onchange="datNV(\''+s.ma+'\',\''+n.ma+'\',this.checked)">':'';
  return '<div class="nv'+(cheDo==='khac'?' mo':'')+'"><div class="nvDau">'+tick+
      '<span class="nvHang">'+(cheDo==='khac'?'·':(HUY[i]||'#'+(i+1)))+'</span><b class="nvTen">'+esc(n.ten)+'</b><span class="nvSo">'+f1(n.dtqd)+' tr</span></div>'+
    '<div class="bar mong"><i style="width:'+Math.max(2,Math.min(100,(n.dtqd||0)/max*100))+'%;background:var(--xanh)"></i></div>'+
    '<div class="phu">SL '+f1(n.sl)+' · tỉ trọng '+pc(n.tiTrong)+' · trả góp '+f1(n.traGop)+' tr ('+pc(gop)+')'+
      (cheDo==='khac'&&lyDoKhac(s,n)?' · <i>'+esc(lyDoKhac(s,n))+'</i>':'')+'</div>'+
    (ng.length?'<div class="chips">'+ng.map(function(g){return '<span>'+esc(g.ten)+' <b>'+f1(g.dtqd)+'</b></span>';}).join('')+'</div>':'')+
  '</div>';
}
function veNV(s){
  if(!s.daDoc.nhanVien) return '<h3>👥 Nhân viên</h3><div class="phu">Chưa đọc được bảng nhân viên.</div>';
  var chinh=dsNV(s), khac=nvKhac(s), max=Math.max.apply(null,chinh.map(function(n){return n.dtqd||0;}).concat([1]));
  var h='<h3>👥 Nhân viên chính <span class="pill">'+chinh.length+'</span></h3>'+
    '<div class="phu">'+(GC&&GC.theoST[s.ma]?'Tự lọc theo giờ công '+esc(GC.tu||'')+'–'+esc(GC.den||'')+': chỉ BP All In One. ':'Chưa có giờ công (cần app 5.5) — tạm lấy mọi người có mã NV. ')+
      'Tích / bỏ tích để sửa tay (nhớ theo mã NV).</div>';
  chinh.forEach(function(n,i){ h+=theNV(s,n,i,max,'chinh'); });
  if(khac.length){
    h+='<h3>NV khác / online (không xếp hạng) <span class="pill">'+khac.length+'</span></h3>';
    khac.forEach(function(n){ h+=theNV(s,n,0,max,'khac'); });
  }
  var a=cong(chinh,'dtqd'), b=cong(khac,'dtqd'), w=s.tong.dtqd, lech=w!=null?Math.round((w-a-b)*10)/10:null;
  h+='<div class="doiChieu'+(lech?' lech':'')+'">Tổng NV chính '+f1(a)+' tr + NV khác '+f1(b)+' tr = '+f1(a+b)+' tr; siêu thị '+f1(w)+' tr'+(lech!=null?'; chênh '+f1(lech)+' tr':'')+'</div>';
  return h;
}
function datNV(ma,maNV,chinh){
  var s=KQ.sieuThi[ma], n=s&&s.nv.filter(function(x){return x.ma===maNV;})[0];
  NVPHU[ma]=NVPHU[ma]||{};
  if(n&&chinh===chinhTuDong(s,n)) delete NVPHU[ma][maNV]; else NVPHU[ma][maNV]=chinh?'c':1;
  ghi(K_NV,NVPHU); ve();
}

function bangNganh(ds){
  var h='<div class="cuon"><table><tr><th class="ten">Ngành</th><th>SL</th><th>DTQĐ</th><th>Tỉ trọng</th></tr>';
  ds.forEach(function(x){ h+='<tr><td class="ten">'+esc(x.ten)+'</td><td>'+f1(x.sl)+'</td><td><b>'+f1(x.dtqd)+'</b></td><td>'+pc(x.tiTrong)+
    '<span class="minibar"><i style="width:'+Math.min(100,x.tiTrong||0)+'%;background:var(--xanh)"></i></span></td></tr>'; });
  return h+'</table></div>';
}
function veNganh(s){
  if(!s.daDoc.nganh) return '';
  var ds=dsNganh(s);
  return '<h3>📦 Ngành hàng BI '+(KY==='realtime'?'đã bán':'')+' <span class="pill">'+ds.length+'/'+s.nganh.length+'</span></h3>'+
    (ds.length?bangNganh(ds):'<div class="phu">Chưa ngành nào có số.</div>');
}

function veMaTran(s){
  var chinh=nvChinh(s); if(!chinh.some(function(n){return n.nganh.length;})) return '';
  var cot={}; chinh.forEach(function(n){ n.nganh.forEach(function(g){ cot[g.ten]=(cot[g.ten]||0)+(g.dtqd||0); }); });
  var ten=Object.keys(cot).filter(function(k){return cot[k];}).sort(function(a,b){return cot[b]-cot[a];});
  if(!ten.length) return '';
  var h='<details style="margin-top:8px"><summary>🧮 Theo NV × ngành BI (DTQĐ)</summary><div class="cuon"><table><tr><th class="ten">NV</th>'+ten.map(function(t){return '<th>'+esc(t)+'</th>';}).join('')+'<th>Tổng</th></tr>';
  chinh.slice().sort(function(a,b){return (b.dtqd||0)-(a.dtqd||0);}).forEach(function(n){
    var m={}; n.nganh.forEach(function(g){m[g.ten]=g.dtqd;});
    h+='<tr><td class="ten">'+esc(n.ten)+'</td>'+ten.map(function(t){return '<td>'+(m[t]?f1(m[t]):'')+'</td>';}).join('')+'<td><b>'+f1(n.dtqd)+'</b></td></tr>';
  });
  h+='<tr><td class="ten"><b>Tổng</b></td>'+ten.map(function(t){return '<td><b>'+f1(cot[t])+'</b></td>';}).join('')+'<td><b>'+f1(cong(chinh,'dtqd'))+'</b></td></tr>';
  return h+'</table></div></details>';
}

/* ---------- chọn ngành quan tâm ---------- */
function moChonQT(ma){
  var s=KQ.sieuThi[ma], an=QT[ma]||{};
  var h='<b>Chọn ngành thi đua theo dõi — '+esc(s.ten)+'</b><div class="hang"><button class="mini" onclick="datTatQT(\''+ma+'\',true)">Chọn hết</button><button class="mini phu2" onclick="datTatQT(\''+ma+'\',false)">Bỏ hết</button><button class="mini" onclick="dongHop()">Xong</button></div>';
  s.thiDua.slice().sort(function(a,b){return a.ten.localeCompare(b.ten,'vi');}).forEach(function(t){
    h+='<label><input type="checkbox"'+(an[t.ten]===false?'':' checked')+' onchange="datQT(\''+ma+'\',this.dataset.t,this.checked)" data-t="'+esc(t.ten)+'">'+esc(t.ten)+' <span class="phu">'+t.loai+'</span></label>';
  });
  document.getElementById('hopND').innerHTML=h; document.getElementById('hop').classList.remove('an');
}
function datQT(ma,ten,co){ QT[ma]=QT[ma]||{}; if(co)delete QT[ma][ten]; else QT[ma][ten]=false; ghi(K_QT,QT); }
function datTatQT(ma,co){ QT[ma]={}; if(!co) KQ.sieuThi[ma].thiDua.forEach(function(t){QT[ma][t.ten]=false;}); ghi(K_QT,QT); moChonQT(ma); }
function dongHop(){ document.getElementById('hop').classList.add('an'); ve(); }

/* ---------- chép / xuất ---------- */
function vanBan(){
  var g=GOI[KY], d=[];
  d.push('📊 '+TEN_KY[KY].toUpperCase()+' · '+docLuc(g.luc).toLocaleString('vi-VN'));
  KQ.thuTu.filter(function(m){return XEM==='tat'||XEM===m;}).forEach(function(ma){
    var s=KQ.sieuThi[ma], t=s.tong;
    d.push('','🏬 '+s.ten+': '+f1(t.dtqd)+'/'+f1(t.target)+' tr ('+pc(t.ht)+')'+(KY==='luyke'&&t.duBao!=null?' · dự báo '+pc(t.duBao):'')+' · SL '+f1(t.sl)+((t.traGop!=null&&t.dtqd)?' · góp '+pc(t.traGop/t.dtqd*100):''));
    var td=dsThiDua(s);
    if(td.length){ d.push('🏁 Thi đua '+(KY==='realtime'?'đã bán':'(% target giảm dần)')+':');
      td.forEach(function(x){ d.push(' • '+x.ten+' '+x.loai+': '+(x.loai==='SL'?f1(x.th):f2(x.th))+'/'+(x.loai==='SL'?f1(x.target):f2(x.target))+' ('+pc(x.ht)+(KY==='luyke'&&x.duBao!=null?' → dự báo '+pc(x.duBao):'')+')'); }); }
    var nv=dsNV(s);
    if(nv.length){ d.push('👥 Nhân viên:'); nv.forEach(function(n,i){
      var ng=nganhNV(n).slice(0,4).map(function(g){return g.ten+' '+f1(g.dtqd);}).join(', ');
      d.push(' '+(HUY[i]||(i+1)+'.')+' '+n.ten+': '+f1(n.dtqd)+' tr · SL '+f1(n.sl)+(ng?' ('+ng+')':'')); }); }
  });
  return d.join('\n');
}
function chepBaoCao(){ var t=vanBan(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){thongBao('ok: đã chép báo cáo');},function(){ document.getElementById('oDan').value=t; document.getElementById('napTay').open=true; thongBao('loi: máy không cho chép tự động — văn bản đã đặt vào ô bên dưới'); }); }

/* ---------- ảnh chia sẻ ----------
 * Mỗi siêu thị 1 ảnh khổ dọc 600px (vẽ riêng, không chụp màn đang xem) → gửi:
 *  1) app DataSnap: window.DataSnapApp.chiaSeAnh('[{"ten":"a.png","data":"<base64>"}]') → bảng chia sẻ Android
 *  2) trình duyệt: navigator.share({files}) (Chrome điện thoại)
 *  3) còn lại: hộp xem ảnh — bấm giữ để lưu, hoặc nút Tải về. */
function veAnh(ma){
  var s=KQ.sieuThi[ma], t=s.tong, ht=htST(t), m=mau(KY==='luyke'&&t.duBao!=null?t.duBao:ht);
  var td=dsThiDua(s), nv=dsNV(s), ng=dsNganh(s), max=Math.max.apply(null,nv.map(function(n){return n.dtqd||0;}).concat([1]));
  var h='<div class="anh"><div class="anhDau"><div><div class="anhTen">'+esc(s.ten)+'</div>'+
      '<div class="anhPhu">'+TEN_KY[KY].toUpperCase()+' · DT quy đổi · cập nhật '+esc(s.capNhat||'—')+'</div></div>'+
      '<div class="anhHT">'+pc(ht)+'<small>'+(KY==='realtime'?'HT target ngày':'HT target tháng')+'</small></div></div>'+
    '<div class="anhThan"><div class="bar"><i style="width:'+Math.min(100,ht||0)+'%;background:'+m+'"></i></div>'+veTiles(t);
  // ảnh gửi nhóm: Lũy kế cũng bỏ hàng 0 khỏi bảng (ảnh từng dài 7000px), gom tên vào 1 dòng
  var td0=KY==='luyke'?td.filter(function(x){return !(x.th>0);}):[];
  if(td0.length) td=td.filter(function(x){return x.th>0;});
  if(s.daDoc.thiDua) h+='<h3>🏁 Thi đua '+(KY==='realtime'?'đã bán hôm nay':'— % target giảm dần')+'</h3><div class="phu">'+tomTatTD(s,td.concat(td0))+'</div>'+
    (td.length?bangThiDua(td):'<div class="phu">Chưa bán chương trình thi đua nào.</div>')+
    (td0.length?'<div class="phu" style="margin-top:6px"><b>Chưa có số ('+td0.length+'):</b> '+td0.map(function(x){return esc(x.ten);}).join(' · ')+'</div>':'');
  if(nv.length){ h+='<h3>👥 Nhân viên</h3>'; nv.forEach(function(n,i){ h+=theNV(s,n,i,max,'anh'); }); }
  if(ng.length) h+='<h3>📦 Ngành hàng BI</h3>'+bangNganh(ng);
  return h+'</div><div class="anhChan">DataSnap · xuất lúc '+new Date().toLocaleString('vi-VN')+'</div></div>';
}
function napH2C(xong){
  if(window.html2canvas) return xong();
  var sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  sc.onload=xong; sc.onerror=function(){ thongBao('loi: cần mạng để dựng ảnh lần đầu'); }; document.head.appendChild(sc);
}
function chiaSeAnh(ma){
  var ds=(ma==='tat'?KQ.thuTu:[ma]), khung=document.getElementById('khungAnh'), anh=[];
  thongBao('ok: đang dựng '+ds.length+' ảnh…');
  napH2C(function(){
    ds.reduce(function(p,m){ return p.then(function(){
      khung.innerHTML=veAnh(m);
      return html2canvas(khung.firstChild,{scale:2,backgroundColor:'#ffffff'}).then(function(c){
        anh.push({ten:'bao-cao-'+KY+'-'+m+'-'+new Date().toISOString().slice(0,10)+'.png', url:c.toDataURL('image/png')});
      });
    }); }, Promise.resolve()).then(function(){ khung.innerHTML=''; guiAnh(anh); },
      function(e){ khung.innerHTML=''; thongBao('loi: dựng ảnh hỏng — '+e); });
  });
}
function tepAnh(a){ var b=atob(a.url.split(',')[1]), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return new File([u],a.ten,{type:'image/png'}); }
var ANH_CHO=[];
function guiAnh(anh){
  ANH_CHO=anh;
  if(window.DataSnapApp&&window.DataSnapApp.chiaSeAnh){
    try{ window.DataSnapApp.chiaSeAnh(JSON.stringify(anh.map(function(a){return {ten:a.ten,data:a.url.split(',')[1]};}))); thongBao('ok: đã mở bảng chia sẻ'); return; }catch(e){}
  }
  var tep=null; try{ tep=anh.map(tepAnh); }catch(e){}
  if(tep&&navigator.canShare&&navigator.canShare({files:tep})){
    navigator.share({files:tep,title:'Báo cáo '+TEN_KY[KY]}).then(function(){ thongBao('ok: đã chia sẻ'); },function(){ xemAnh(); });
    return;
  }
  xemAnh();
}
function xemAnh(){
  var coShare=!!(navigator.canShare&&window.File);
  var h='<b>Ảnh báo cáo ('+ANH_CHO.length+')</b><div class="phu">Bấm giữ ảnh để lưu / gửi, hoặc dùng nút bên dưới.</div><div class="hang">'+
    (coShare?'<button onclick="guiLaiAnh()">📤 Chia sẻ</button>':'')+
    ANH_CHO.map(function(a){return '<a download="'+a.ten+'" href="'+a.url+'"><button class="phu2">⬇ Tải '+esc(a.ten.split('-')[3]||'')+'</button></a>';}).join('')+
    '<button class="phu2" onclick="dongHop()">Đóng</button></div>'+
    ANH_CHO.map(function(a){return '<img src="'+a.url+'" style="width:100%;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0">';}).join('');
  document.getElementById('hopND').innerHTML=h; document.getElementById('hop').classList.remove('an');
}
function guiLaiAnh(){ var tep=ANH_CHO.map(tepAnh); navigator.share({files:tep,title:'Báo cáo '+TEN_KY[KY]}).catch(function(){}); }

/* ---------- bot LINE (/so = Realtime, /tonghop = Lũy kế) ----------
 * Mỗi lần nhận gói: gửi BẢN TÓM TẮT cả 2 kỳ (đúng thứ tự/lọc như màn xem: NV chính,
 * thi đua đã bán…) cho bot. Bot chỉ giữ trong bộ nhớ tạm 6 tiếng rồi tự xoá — không database.
 * Gửi cả Lũy kế mỗi lần để bản Lũy kế (chỉ quét buổi sáng) không hết hạn giữa ngày.
 * Khoá: chuỗi ngẫu nhiên sinh 1 lần trên máy; bot nhận khoá đầu tiên rồi chỉ tin khoá đó. */
var BOT_URL='https://script.google.com/macros/s/AKfycbxyrv1Z5c_eRU-JHIbT4oHfACkSMOlQ1BaVofrdADC3T5ozmPuAZTBoKjYlxg8m66vc/exec';
var K_BOT='dmxsnap_bot_v1', BOT=doc(K_BOT,{});
function khoaBot(){
  if(!BOT.khoa){ var a=new Uint8Array(16); crypto.getRandomValues(a); BOT.khoa=Array.prototype.map.call(a,function(x){return ('0'+x.toString(16)).slice(-2);}).join(''); ghi(K_BOT,BOT); }
  return BOT.khoa;
}
function so1(v){ return v==null?null:Math.round(v*10)/10; }
function tomTatBot(ky){
  if(!GOI[ky]) return null;
  var giuKY=KY, giuKQ=KQ;
  KY=ky; KQ=DmxSnap.docGoi(GOI[ky]);
  try{
    return { ky:ky, luc:GOI[ky].luc, cum:GOI[ky].cum||'', sieuThi:KQ.thuTu.map(function(ma){
      var s=KQ.sieuThi[ma], t=s.tong, td=dsThiDua(s);
      var coSo=td.filter(function(x){return x.th>0;}), chuaCo=td.filter(function(x){return !(x.th>0);});
      return { ma:ma, ten:s.ten, capNhat:s.capNhat,
        tong:{ dtqd:so1(t.dtqd), target:so1(t.target), ht:so1(htST(t)), duBao:so1(t.duBao), duKienTien:so1(t.duKienTien),
               traGop:so1(t.traGop), sl:t.sl, tienDo:so1(t.tienDo) },
        thiDua:coSo.map(function(x){ return {ten:x.ten, loai:x.loai, th:so1(x.th), target:so1(x.target), ht:so1(x.ht), duBao:so1(x.duBao)}; }),
        chuaCo:chuaCo.map(function(x){return x.ten;}),
        nv:dsNV(s).slice(0,12).map(function(n){ return {ten:n.ten, dtqd:so1(n.dtqd), sl:n.sl, traGop:so1(n.traGop),
             ng:nganhNV(n).slice(0,3).map(function(g){return [g.ten, so1(g.dtqd)];})}; }) };
    }) };
  } finally { KY=giuKY; KQ=giuKQ; }
}
function veBot(){
  var el=document.getElementById('khuBot'); if(!el) return;
  var l=BOT.lan;
  el.innerHTML='🤖 Bot LINE (/so · /tonghop): '+(BOT.tat?'<b>đang tắt</b>':
      l?(l.dang?'đang gửi…':l.ok?'đã gửi '+esc(l.gio)+' ✓':'<b style="color:var(--do)">gửi lỗi '+esc(l.gio)+' — '+esc(l.loi)+'</b>'):'chưa gửi')+
    ' <button class="mini" onclick="guiBot(true)">Gửi lại</button>'+
    ' <button class="mini phu2" onclick="BOT.tat=!BOT.tat;ghi(K_BOT,BOT);veBot()">'+(BOT.tat?'Bật':'Tắt')+'</button>'+
    (l&&l.ok&&l.loi?'<br><b style="color:var(--do)">⚠ '+esc(l.loi)+'</b>':'')+
    (KQ&&KQ.thuTu.length?'<br>Gắn nhóm LINE: mời bot vào nhóm rồi gõ '+KQ.thuTu.map(function(m){return '<b>/dangky '+esc(m)+'</b> ('+esc(KQ.sieuThi[m].ten)+')';}).join(' · '):'');
}
function guiBot(tay){
  if(BOT.tat&&!tay){ veBot(); return; }
  var goi=['realtime','luyke'].map(tomTatBot).filter(Boolean);
  if(!goi.length) return;
  var gio=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}), dau=dauGoi();
  BOT.lan={dang:true,gio:gio}; veBot();
  fetch(BOT_URL,{method:'POST',body:JSON.stringify({lenh:'goiSo',khoa:khoaBot(),goi:goi})})
    .then(function(r){return r.json();})
    .then(function(kq){ BOT.lan={ok:!!kq.ok,gio:gio,loi:kq.loi||((kq.tuChoi||[]).length?'bot từ chối '+kq.tuChoi.join('; '):'')}; if(kq.ok) BOT.dau=dau; })
    .catch(function(e){ BOT.lan={ok:false,gio:gio,loi:'mất mạng? '+e.message}; })
    .then(function(){ ghi(K_BOT,BOT); veBot(); baoApp(); });
}
// App quét xong nạp Realtime rồi Lũy kế liền nhau → đợi 2 giây gửi MỘT lần cả hai.
var hen=null;
function henGuiBot(){ clearTimeout(hen); hen=setTimeout(function(){ guiBot(); },2000); }
// Báo kết quả cho app DataSnap (nếu app có cầu nối) để thanh nổi hiện “Bot LINE: đã gửi ✓”.
function baoApp(){ try{ if(window.DataSnapApp&&DataSnapApp.botDaGui) DataSnapApp.botDaGui(JSON.stringify(BOT.lan)); }catch(e){} }

// Dấu của các gói đang có — mở trang mà gói chưa từng gửi thành công (app nạp gói từ máy
// mà không gọi nhanGoi, hoặc lần trước mất mạng) thì gửi luôn.
function dauGoi(){ return ['realtime','luyke'].map(function(k){return GOI[k]?GOI[k].luc:'';}).join('|'); }

ve(); veBot();
if(Object.keys(GOI).length&&!BOT.tat&&BOT.dau!==dauGoi()) guiBot();
</script>
