<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thẻ Mục Tiêu</title>
<style>
  :root { --ink:#0f172a; --sub:#64748b; --line:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink); background:#f1f5f9; }
  header.bar { position:sticky; top:0; z-index:50; background:#0f172a; color:#fff; padding:12px 14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  header.bar h1 { font-size:16px; margin:0 10px 0 0; font-weight:800; color:#ffd23f; }
  header.bar .spacer { flex:1; }
  button.act { border:0; border-radius:9px; padding:9px 14px; font-size:14px; font-weight:700; color:#fff; cursor:pointer; }
  .b-make { background:#2563eb; } .b-pub { background:#0f766e; } .b-dl { background:#7c3aed; } .b-cfg { background:#475569; }
  button.act:disabled { opacity:.5; cursor:default; }
  #status { padding:10px 14px; font-size:13.5px; color:var(--sub); white-space:pre-wrap; }
  #status b { color:var(--ink); }
  #gallery { padding:8px 14px 40px; display:flex; flex-direction:column; gap:22px; }
  .store-block h2 { font-size:15px; margin:6px 0 10px; color:var(--ink); }
  .cards { display:flex; flex-direction:column; gap:16px; }
  .cards canvas { width:100%; max-width:760px; height:auto; border:1px solid var(--line); border-radius:12px; box-shadow:0 4px 14px rgba(0,0,0,.08); background:#fff; }
  .hint { padding:10px 14px; font-size:12.5px; color:var(--sub); }
  .hint code { background:#e2e8f0; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header class="bar">
  <h1>Thẻ Mục Tiêu</h1>
  <button class="act b-make" id="btn-make">🔄 Tạo lại thẻ</button>
  <button class="act b-pub"  id="btn-pub" disabled>⬆ Đẩy /bc lên GitHub</button>
  <button class="act b-dl"   id="btn-dl"  disabled>💾 Tải ảnh về máy</button>
  <span class="spacer"></span>
  <button class="act b-cfg" id="btn-cfg">⚙ Token</button>
</header>

<div id="status">Đang nạp dữ liệu…</div>
<div class="hint">
  Nguồn số: <code>analysisAppData_v2</code> (đồng bộ từ Supabase — hãy đăng nhập ở Trang chủ trước nếu máy này chưa có số).
  Ảnh dựng ngay trên trình duyệt, không cần Claude. Bấm <b>Đẩy /bc</b> để nhóm LINE gõ <code>/bc</code> thấy được.
</div>
<div id="gallery"></div>

<!-- Đồng bộ đám mây (dùng chung phiên đăng nhập với nv.html/index.html cùng origin) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/cloud-config.js"></script>
<script src="assets/cloud-sync.js"></script>
<script> try { CloudSync.init({ keys: ['analysisAppData_v2'], loginHere: false }); } catch(e){} </script>

<!-- Cấu hình cụm siêu thị (đa cụm) — muc-tieu-card.js đọc để lấy đúng "key"
     đặt tên ảnh /bc. Nạp TRƯỚC nó, và làm mới bản sao trên máy ở chế độ nền. -->
<script src="dmx-cluster-shared.js"></script>
<script>
  try {
    var _site = DMXCluster.getSiteCode();
    if (_site) DMXCluster.fetchConfig(_site).catch(function(){});
  } catch (e) {}
</script>

<!-- Lõi tính STRAM + vẽ thẻ (dùng chung với nv.html/Trang Cá Nhân NV) -->
<script src="assets/muc-tieu-card.js"></script>

<script>
/* =======================================================================
 * themuctieu.html — Công cụ dựng THẺ MỤC TIÊU ngày + đẩy /bc lên GitHub.
 * Lõi tính STRAM + vẽ thẻ (buildCards/renderStore) nằm ở assets/muc-tieu-card.js
 * (dùng chung với nv.html). File này chỉ còn phần điều khiển trang + đẩy GitHub.
 * ===================================================================== */
(function () {
  'use strict';

  var STORES = MucTieuCard.STORES, MNAME = MucTieuCard.MNAME;
  var buildCards = MucTieuCard.buildCards, renderStore = MucTieuCard.renderStore;

  var GH_OWNER='namkphong', GH_REPO='namkphong.github.io', GH_BRANCH='main', BC_DIR='bc/mt';
  var K_GH_TOKEN = 'gh_token_bc';   // fine-grained PAT (Contents R/W), lưu localStorage máy này

  /* =================================================================== */
  /* ================== ĐẨY LÊN GITHUB (fetch, token localStorage) ====== */
  /* =================================================================== */
  function b64utf8(s){ return btoa(unescape(encodeURIComponent(s))); }
  function ghHeaders(token,extra){ var h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; if(extra) for(var k in extra) h[k]=extra[k]; return h; }
  function ghUrl(path){ return 'https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path; }
  function rawUrl(path){ return 'https://raw.githubusercontent.com/'+GH_OWNER+'/'+GH_REPO+'/'+GH_BRANCH+'/'+path; }
  function getToken(){ var v=localStorage.getItem(K_GH_TOKEN); if(v) return v; v=(prompt('Dán GitHub token (fine-grained, quyền Contents R/W cho namkphong.github.io):')||'').trim(); if(!v) throw new Error('Chưa nhập token'); localStorage.setItem(K_GH_TOKEN,v); return v; }
  async function ghGetSha(token,path){ var r=await fetch(ghUrl(path)+'?ref='+GH_BRANCH+'&_='+Date.now(),{headers:ghHeaders(token,{'Cache-Control':'no-cache'})}); if(r.status===404) return null; if(r.status>=400) throw new Error('GET '+path+' lỗi '+r.status); var j=await r.json(); return j.sha||null; }
  async function ghPut(token,path,contentB64,message){
    async function attempt(sha){ var body={message:message,content:contentB64,branch:GH_BRANCH}; if(sha) body.sha=sha; return fetch(ghUrl(path),{method:'PUT',headers:ghHeaders(token,{'Content-Type':'application/json'}),body:JSON.stringify(body)}); }
    var r=await attempt(await ghGetSha(token,path));
    if(r.status===409||r.status===422) r=await attempt(await ghGetSha(token,path));
    if(r.status>=400){ var tx=await r.text(); throw new Error('PUT '+path+' lỗi '+r.status+': '+tx.slice(0,160)); }
    return r.json();
  }
  function canvasToB64(cv){ var d=cv.toDataURL('image/png'); return d.slice(d.indexOf(',')+1); }

  async function publishBc(){
    var token=getToken();
    var nowISO=new Date().toISOString();
    var manifest={ updatedAt:nowISO, type:'the-muc-tieu', stores:{} };
    var total=0; STORES.forEach(function(S){ if(RENDERED[S.code]) total+=RENDERED[S.code].length; });
    var done=0;
    for(var si=0; si<STORES.length; si++){
      var S=STORES[si]; var imgs=RENDERED[S.code]; if(!imgs||!imgs.length) continue;
      var arr=[];
      for(var i=0;i<imgs.length;i++){
        var path=BC_DIR+'/'+S.key+'_'+(i+1)+'.png';
        setStatus('Đang đẩy '+S.label+' — ảnh '+(i+1)+'/'+imgs.length+' … ('+(++done)+'/'+total+')');
        await ghPut(token, path, canvasToB64(imgs[i]), 'bc/mt: '+S.label+' thẻ mục tiêu '+(i+1));
        arr.push({ url: rawUrl(path) });
      }
      manifest.stores[S.key]={ key:S.key, label:S.label, group:S.group, date:LAST_META.dateFull, images:arr, at:nowISO };
    }
    setStatus('Đang cập nhật manifest bc/cards.json …');
    await ghPut(token,'bc/cards.json', b64utf8(JSON.stringify(manifest,null,2)), 'bc: cập nhật cards.json (thẻ mục tiêu '+LAST_META.dateFull+')');
    setStatus('✅ Đã đẩy /bc xong. Trong nhóm LINE gõ /bc để xem. (Bot đọc raw nên hiện ngay, không cần chờ Pages.)');
  }

  /* =================================================================== */
  /* ================== GIAO DIỆN / ĐIỀU KHIỂN ========================== */
  /* =================================================================== */
  var RENDERED={}, LAST_META=null;
  // "Cửa" cho userscript Violentmonkey (dmx-themuctieu-publish) tự động đọc ảnh & đẩy GitHub.
  window.TMT = {
    ready:false,
    rebuild:function(){ makeCards(); },
    meta:function(){ return LAST_META; },
    getStores:function(){
      return STORES.map(function(S){
        return { code:S.code, key:S.key, label:S.label, group:S.group,
                 date:LAST_META&&LAST_META.dateFull,
                 pngs:(RENDERED[S.code]||[]).map(function(cv){ return cv.toDataURL('image/png'); }) };
      }).filter(function(s){ return s.pngs.length; });
    }
  };
  function setStatus(html){ document.getElementById('status').innerHTML=html; }
  function getData(){ var raw=localStorage.getItem('analysisAppData_v2'); if(!raw) return null; try{ var d=JSON.parse(raw); return d.analysisAppData_v2||d; }catch(e){ return null; } }

  function makeCards(){
    if(window.TMT) window.TMT.ready=false;
    var root=getData();
    if(!root||!root.supermarkets){ setStatus('⚠ Chưa có dữ liệu <b>analysisAppData_v2</b> trên máy này.\nHãy mở <b>nv.html</b> đăng nhập & cập nhật số trước (hoặc đăng nhập ở Trang chủ để kéo từ Supabase), rồi quay lại bấm "Tạo lại thẻ".'); return; }
    var gallery=document.getElementById('gallery'); gallery.innerHTML=''; RENDERED={};
    var res; try{ res=buildCards(root); }catch(e){ setStatus('✗ Lỗi tính toán: '+(e.message||e)); return; }
    LAST_META=res.meta;
    var totalImgs=0, lines=[];
    STORES.forEach(function(S){
      var cards=res.stores[S.code]; if(!cards||!cards.length){ lines.push('• '+S.label+': không có nhân viên có target.'); return; }
      var canvases=renderStore(S.code, cards, res.meta); RENDERED[S.code]=canvases; totalImgs+=canvases.length;
      var block=document.createElement('div'); block.className='store-block';
      var h=document.createElement('h2'); h.textContent=S.label+' — '+cards.length+' nhân viên · '+canvases.length+' ảnh'; block.appendChild(h);
      var wrap=document.createElement('div'); wrap.className='cards';
      canvases.forEach(function(cv){ wrap.appendChild(cv); }); block.appendChild(wrap); gallery.appendChild(block);
      var fl=res.focuslog[S.code]; lines.push('• <b>'+S.label+'</b>: 6 nhóm phải đẩy = '+(fl.focus.join(', ')||'-')+' · dự phòng: '+(fl.backup.join(', ')||'-'));
    });
    document.getElementById('btn-pub').disabled = totalImgs===0;
    document.getElementById('btn-dl').disabled  = totalImgs===0;
    setStatus('<b>Đã dựng '+totalImgs+' ảnh</b> · chốt '+res.meta.CHOT+' → nhiệm vụ '+res.meta.NHIEMVU+' (kỳ vọng '+res.meta.KY+'%).\n'+lines.join('\n')+'\n\nKiểm tra ảnh rồi bấm <b>⬆ Đẩy /bc lên GitHub</b>.');
    if(window.TMT && totalImgs>0){ window.TMT.ready=true; try{ window.dispatchEvent(new Event('tmt:ready')); }catch(e){} }
  }

  function downloadAll(){
    STORES.forEach(function(S){ (RENDERED[S.code]||[]).forEach(function(cv,i){ var a=document.createElement('a'); a.href=cv.toDataURL('image/png'); a.download='TheMucTieu_'+S.key+'_'+(i+1)+'.png'; document.body.appendChild(a); a.click(); document.body.removeChild(a); }); });
  }

  function configToken(){
    var cur=localStorage.getItem(K_GH_TOKEN);
    var pick=prompt('Token GitHub cho việc đẩy /bc:\n  1 = Nhập / đổi token\n  x = Xoá token đã lưu\n\n'+(cur?'(đang có token đã lưu)':'(chưa lưu token)'),'1');
    if(pick===null) return; pick=pick.trim().toLowerCase();
    if(pick==='x'){ localStorage.removeItem(K_GH_TOKEN); setStatus('Đã xoá token GitHub đã lưu.'); return; }
    if(pick==='1'){ var t=(prompt('Dán GitHub token (fine-grained, Contents R/W):')||'').trim(); if(t){ localStorage.setItem(K_GH_TOKEN,t); setStatus('Đã lưu token GitHub.'); } }
  }

  function bind(id,fn){ document.getElementById(id).addEventListener('click', function(){ var b=this; b.disabled=true; Promise.resolve().then(fn).catch(function(e){ setStatus('✗ '+(e.message||e)); }).then(function(){ b.disabled=false; if(id==='btn-pub'||id==='btn-dl'){ /* trạng thái do makeCards quản */ } }); }); }
  bind('btn-make', makeCards);
  bind('btn-pub',  publishBc);
  bind('btn-dl',   function(){ downloadAll(); });
  document.getElementById('btn-cfg').addEventListener('click', configToken);

  // Tự dựng khi mở trang (nếu đã có dữ liệu). Chờ 1 nhịp cho cloud-sync kịp init.
  setTimeout(makeCards, 400);


})();
</script>
</body>
</html>
